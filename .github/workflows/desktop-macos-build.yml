name: Build patched Paseo for macOS

# Builds an unsigned, patched Paseo .dmg/.zip for macOS and publishes it to this
# repo's Releases, alongside the Android APK for the same upstream tag.
#
# Chained off the Android workflow so one upstream release produces
# apk -> dmg/zip -> exe in order, without three workflows racing on the same
# Release. The daily schedule is a safety net: if the chained run was skipped,
# or the desktop build failed and the Android release was already published,
# this picks the work back up. `resolve` re-checks the Release for every
# expected asset, so a re-run only fills in what is actually missing.
#
# The built app is pointed at THIS repo's Releases for its own updates. See
# README ("Update hijack") for what that does and does not buy you on macOS.

on:
  workflow_run:
    workflows: ["Build status-bar-fixed Paseo APK"]
    types: [completed]
  schedule:
    - cron: "43 4 * * *" # daily, off-peak minute
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (blank = latest non-draft release)"
        required: false
        type: string
      force:
        description: "Rebuild even if this release already has every macOS artifact"
        required: false
        type: boolean
        default: false

# Shared with the Windows workflow so the two desktop builds never write to the
# same Release at the same time. Deliberately NOT shared with the Android
# workflow, which must stay runnable on its own schedule.
concurrency:
  group: paseo-desktop-builds-v1
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: getpaseo/paseo
  DESKTOP_PACKAGE_PATH: packages/desktop

  # Where the built app looks for its own updates. electron-builder writes this
  # into Contents/Resources/app-update.yml at pack time, so redirecting the
  # updater is a build-config change, not a code patch.
  PUBLISH_OWNER: Costben
  PUBLISH_REPO: paseo-statusbar-builds

  # electron-updater resolves <channel>-mac.yml, where <channel> is the app's
  # release-channel setting ("latest" for stable, "beta" for beta). We generate
  # `latest` and publish byte-identical copies for EXTRA_CHANNELS, so both
  # settings resolve to the same build.
  MANIFEST_CHANNEL: latest
  EXTRA_CHANNELS: beta

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      is_prerelease: ${{ steps.pick.outputs.is_prerelease }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
            is_prerelease="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" --jq '.prerelease' 2>/dev/null || echo false)"
            echo "Using requested tag: $tag"
          else
            release="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq 'map(select(.draft == false))
                    | sort_by(.published_at) | reverse | .[0]')"
            tag="$(jq -r '.tag_name // empty' <<< "$release")"
            is_prerelease="$(jq -r '.prerelease // false' <<< "$release")"
            echo "Latest upstream release: $tag (prerelease=$is_prerelease)"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve an upstream tag." >&2
            exit 1
          fi
          # v0.9.1 / desktop-v0.9.1 / desktop-macos-v0.9.1 -> 0.9.1
          version="$(printf '%s' "$tag" | sed -E 's/^(desktop(-(windows|linux|macos))?|android)-v/v/; s/^v//')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream $tag as version $version"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.pick.outputs.tag }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force requested; will rebuild."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=()
          for pattern in \
            '^Paseo-.*-arm64\.dmg$' \
            '^Paseo-.*-arm64\.zip$' \
            '^Paseo-.*-x64\.dmg$' \
            '^Paseo-.*-x64\.zip$' \
            '^latest-mac\.yml$' \
            '^beta-mac\.yml$'; do
            grep -Eq "$pattern" <<< "$assets" || missing+=("$pattern")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "Release $tag already has every macOS artifact; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $tag is missing: ${missing[*]}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build and publish (macOS ${{ matrix.electron_arch }})
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per architecture on purpose: `npm ci` installs the
          # prebuilt native packages (sherpa-onnx, sharp) for the runner's own
          # architecture, so an x64 build on an arm64 runner would silently ship
          # without them.
          - runner: macos-14
            electron_arch: arm64
            node_heap_mb: 4096
          - runner: macos-15-intel
            electron_arch: x64
            node_heap_mb: 8192
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Checkout build repo (patch scripts live here)
        uses: actions/checkout@v4

      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/dotnet \
            /usr/local/share/CodeQL \
            /usr/local/Homebrew/Library/Taps \
            "$HOME/.rustup" \
            "$HOME/.cargo" || true
          brew cleanup -s || true

          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: upstream/package-lock.json

      - name: Apply desktop patches
        run: node scripts/apply-desktop-patch.mjs upstream mac

      - name: Install JS dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt ${attempt}/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Set desktop package version from tag
        working-directory: upstream
        env:
          DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error("DESKTOP_VERSION env var is missing");

          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, "package.json");
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          console.log(`Set ${packageJsonPath} version to ${version}`);
          NODE

      - name: Build desktop release
        working-directory: upstream
        env:
          # No Apple Developer ID certificate on this runner, so build unsigned
          # and skip notarization rather than fail on a missing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Metro's web-bundle export OOMs on the last module of the generated
          # validator. Node sizes its default heap from runner RAM, which is not
          # enough on the Intel runner.
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          set -euo pipefail
          build_args=(
            --publish never
            --mac "--${{ matrix.electron_arch }}"
            -c.mac.notarize=false
            "-c.publish.owner=${PUBLISH_OWNER}"
            "-c.publish.repo=${PUBLISH_REPO}"
            -c.publish.releaseType=release
            "-c.publish.channel=${MANIFEST_CHANNEL}"
          )
          echo "electron-builder args: ${build_args[*]}"
          npm run build:desktop -- "${build_args[@]}"

      - name: Verify build artifacts
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          arch="${{ matrix.electron_arch }}"

          # An unsigned build still has to be a build. Anything missing here
          # means electron-builder changed its output layout and the upload
          # step below would publish a release with holes in it.
          shopt -s nullglob
          dmgs=( "$release_dir"/*-"$arch".dmg )
          zips=( "$release_dir"/*-"$arch".zip )
          manifest="$release_dir/${MANIFEST_CHANNEL}-mac.yml"
          shopt -u nullglob

          if (( ${#dmgs[@]} == 0 )); then
            echo "::error::no .dmg for $arch in $release_dir"; ls -la "$release_dir"; exit 1
          fi
          if (( ${#zips[@]} == 0 )); then
            echo "::error::no .zip for $arch in $release_dir (electron-updater needs the zip, not just the dmg)"
            ls -la "$release_dir"; exit 1
          fi
          if [ ! -f "$manifest" ]; then
            echo "::error::updater manifest is missing: $manifest"; ls -la "$release_dir"; exit 1
          fi

          grep -q '^files:' "$manifest" || { echo "::error::$manifest has no files list"; cat "$manifest"; exit 1; }
          grep -q "$arch" "$manifest" || { echo "::error::$manifest does not mention $arch"; cat "$manifest"; exit 1; }

          echo "Artifacts for $arch:"
          ls -la "${dmgs[@]}" "${zips[@]}" "$manifest"
          echo "--- $manifest ---"
          cat "$manifest"

      - name: Publish artifacts to GitHub Release
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          # The Android workflow normally created the release already. Create it
          # here too so a desktop-only run still produces something usable.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Paseo $tag (status bar + desktop patches)" \
              --notes "Automated build of upstream ${UPSTREAM_REPO}@$tag.")
            if [ "${{ needs.resolve.outputs.is_prerelease }}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

          node "${GITHUB_WORKSPACE}/scripts/upload-release-assets.mjs" \
            "$tag" "$release_dir" "$GITHUB_REPOSITORY"

      - name: Stage updater manifests
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          staging="${GITHUB_WORKSPACE}/manifest-staging/${{ matrix.electron_arch }}"
          mkdir -p "$staging"

          # The manifest carries no channel name inside it, so the extra channels
          # are byte-identical copies. The finalize job merges the two
          # architectures into one file before any of them reach the Release.
          cp "${release_dir}/${MANIFEST_CHANNEL}-mac.yml" "$staging/"
          for channel in ${EXTRA_CHANNELS}; do
            cp "${release_dir}/${MANIFEST_CHANNEL}-mac.yml" "$staging/${channel}-mac.yml"
          done
          ls -la "$staging"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.electron_arch }}
          path: manifest-staging/${{ matrix.electron_arch }}
          retention-days: 1

  finalize:
    name: merge arch manifests and publish
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Download per-arch manifests
        uses: actions/download-artifact@v4
        with:
          pattern: mac-manifest-*
          path: manifests

      - name: Install js-yaml
        run: |
          set -euo pipefail
          # merge-mac-manifest.mjs imports js-yaml; installing it at the repo
          # root is what makes the bare specifier resolve from scripts/.
          [ -f package.json ] || printf '{"private":true}\n' > package.json
          npm install --no-save --no-audit --no-fund --no-package-lock js-yaml@4.1.0

      - name: Merge manifests and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/merge-mac-manifest.mjs \
            "manifests/mac-manifest-arm64/${MANIFEST_CHANNEL}-mac.yml" \
            "manifests/mac-manifest-x64/${MANIFEST_CHANNEL}-mac.yml" \
            "merged/${MANIFEST_CHANNEL}-mac.yml"

          for channel in ${EXTRA_CHANNELS}; do
            cp "merged/${MANIFEST_CHANNEL}-mac.yml" "merged/${channel}-mac.yml"
          done

          ls -la merged
          gh release upload "${{ needs.resolve.outputs.tag }}" merged/*.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
