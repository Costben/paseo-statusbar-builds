name: Build patched Paseo for macOS

# Builds a patched Paseo .dmg for macOS (arm64) and publishes it to this repo's
# Releases, alongside the Android APK and the Windows installer for the same
# upstream tag. A Release carries installers only — no archives and no updater
# manifests — so updating means downloading the installer again.
#
# Code signing is optional: with `MAC_CSC_LINK` configured the build signs itself
# with the certificate pinned in that secret; without it electron-builder falls
# back to an ad-hoc signature. Signing matters here for more than updates: macOS
# refuses to load nested code that carries a different certificate, so a
# half-signed bundle dies at launch with `different Team IDs`. See the "Assert
# nested code" step below.
#
# Hardened runtime is on, and with it library validation — a process may only
# load code signed by its own Team ID. A self-signed certificate never gets a
# Team ID, so every binary in the bundle reads `TeamIdentifier=not set` and macOS
# refuses to load the nested frameworks anyway: the build signs cleanly, passes
# every signature check, publishes, and only then dies on the user's Mac. Two
# things hold that shut — `entitlements/` disables library validation, and the
# smoke step launches the packaged app. See README, "A self-signed certificate
# has no Team ID, and hardened runtime cares".
#
# arm64 only, and the runner has to match the target architecture: `npm ci`
# installs the prebuilt native packages (sherpa-onnx, sharp) for the *runner's*
# architecture, so an x64 build on an arm64 runner silently ships without them.
# Adding x64 back means a second matrix entry plus the x64 patterns in `resolve`.
#
# Chained off the Android workflow so one upstream release produces
# apk -> dmg -> exe in order, without three workflows racing on the same
# Release. The daily schedule is a safety net: if the chained run was skipped,
# or the desktop build failed and the Android release was already published,
# this picks the work back up. `resolve` re-checks the Release for every
# expected asset, so a re-run only fills in what is actually missing.
#
# The built app is pointed at THIS repo's Releases for its own updates. See
# README ("Update hijack") for what that does and does not buy you on macOS.
#
# `verify_only` re-checks what is already published instead of building: it
# mounts each released .dmg, re-runs the same signature assertions, and launches
# the .app inside, so a bundle users have already downloaded can be audited —
# including whether it starts at all — without rebuilding it.

on:
  workflow_run:
    workflows: ["Build status-bar-fixed Paseo APK"]
    types: [completed]
  schedule:
    - cron: "43 4 * * *" # daily, off-peak minute
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (blank = latest non-draft release)"
        required: false
        type: string
      force:
        description: "Rebuild even if this release already has every macOS artifact"
        required: false
        type: boolean
        default: false
      verify_only:
        description: "Only re-verify the installers already published for the resolved tag"
        required: false
        type: boolean
        default: false

# Shared with the Windows workflow so the two desktop builds never write to the
# same Release at the same time. Deliberately NOT shared with the Android
# workflow, which must stay runnable on its own schedule.
concurrency:
  group: paseo-desktop-builds-v1
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: getpaseo/paseo
  DESKTOP_PACKAGE_PATH: packages/desktop

  # Where the built app looks for its own updates. electron-builder writes this
  # into Contents/Resources/app-update.yml at pack time, so redirecting the
  # updater is a build-config change, not a code patch.
  PUBLISH_OWNER: Costben
  PUBLISH_REPO: paseo-statusbar-builds

  # The channel the app's updater asks for. No <channel>-mac.yml is published any
  # more, so this only decides which feed name the app looks for; the check finds
  # nothing and the app keeps running. Set explicitly so the feed name stays
  # pinned at Costben's repo instead of upstream's.
  UPDATE_CHANNEL: latest

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      is_prerelease: ${{ steps.pick.outputs.is_prerelease }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
            is_prerelease="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" --jq '.prerelease' 2>/dev/null || echo false)"
            echo "Using requested tag: $tag"
          else
            release="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq 'map(select(.draft == false))
                    | sort_by(.published_at) | reverse | .[0]')"
            tag="$(jq -r '.tag_name // empty' <<< "$release")"
            is_prerelease="$(jq -r '.prerelease // false' <<< "$release")"
            echo "Latest upstream release: $tag (prerelease=$is_prerelease)"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve an upstream tag." >&2
            exit 1
          fi
          # v0.9.1 / desktop-v0.9.1 / desktop-macos-v0.9.1 -> 0.9.1
          version="$(printf '%s' "$tag" | sed -E 's/^(desktop(-(windows|linux|macos))?|android)-v/v/; s/^v//')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream $tag as version $version"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.pick.outputs.tag }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force requested; will rebuild."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=()
          # Installers only: a Release carries no archives and no manifests, so the
          # .dmg is the whole contract for this platform.
          for pattern in \
            '^Paseo-.*-arm64\.dmg$'; do
            grep -Eq "$pattern" <<< "$assets" || missing+=("$pattern")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "Release $tag already has every macOS artifact; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $tag is missing: ${missing[*]}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build and publish (macOS ${{ matrix.electron_arch }})
    needs: resolve
    if: ${{ needs.resolve.outputs.should_build == 'true' && github.event.inputs.verify_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            electron_arch: arm64
            node_heap_mb: 4096
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Checkout build repo (patch scripts live here)
        uses: actions/checkout@v4

      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/dotnet \
            /usr/local/share/CodeQL \
            /usr/local/Homebrew/Library/Taps \
            "$HOME/.rustup" \
            "$HOME/.cargo" || true
          brew cleanup -s || true

          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: upstream/package-lock.json

      - name: Apply desktop patches
        run: node scripts/apply-desktop-patch.mjs upstream mac

      - name: Install JS dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt ${attempt}/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Set desktop package version from tag
        working-directory: upstream
        env:
          DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error("DESKTOP_VERSION env var is missing");

          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, "package.json");
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          console.log(`Set ${packageJsonPath} version to ${version}`);
          NODE

      - name: Prepare code signing
        env:
          CSC_LINK_SECRET: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_SECRET:-}" ]; then
            {
              echo "### macOS build is unsigned"
              echo ""
              echo "No \`MAC_CSC_LINK\` secret is configured, so this build cannot"
              echo "install its own updates on macOS. Users must replace the .dmg"
              echo "by hand. See the README for how to fix that."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
              echo "EXPECT_SIGNED=false"
              # No certificate at all, so an ad-hoc bundle is the expected
              # outcome and the nested-code assertion must not insist that every
              # binary carries one. The smoke step still runs: the entitlements
              # have to keep even an ad-hoc bundle launchable.
              echo "ALLOW_UNSIGNED_APP=1"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CSC_LINK_SECRET" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$CSC_KEY_PASSWORD_SECRET" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          # electron-builder imports CSC_LINK into its own keychain but never sets
          # trust, and `security find-identity -v` — the command it uses to find
          # the identity — only reports *trusted* ones. Without this the
          # certificate is invisible and the build silently falls back to an
          # ad-hoc signature that can never self-update.
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          if ! grep -q "BEGIN CERTIFICATE" "$RUNNER_TEMP/signing.pem"; then
            echo "::error::MAC_CSC_LINK did not yield a certificate (wrong password, or not a .p12 identity)."
            exit 1
          fi
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"

          echo "Identity as electron-builder will see it:"
          security find-identity -v -p codesigning "$keychain"

          {
            echo "CSC_LINK=$RUNNER_TEMP/signing.p12"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "EXPECT_SIGNED=true"
            # A certificate is configured, so every binary has to carry it: an
            # ad-hoc fallback here is a bug, not an expected outcome.
            echo "ALLOW_UNSIGNED_APP=0"
          } >> "$GITHUB_ENV"

      - name: Build desktop release
        working-directory: upstream
        env:
          # CSC_IDENTITY_AUTO_DISCOVERY / CSC_LINK come from the step above:
          # "false" and no certificate when no secret is configured, otherwise
          # the imported identity.
          # Metro's web-bundle export OOMs on the last module of the generated
          # validator. Node sizes its default heap from runner RAM, which is not
          # enough on the Intel runner.
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          set -euo pipefail
          build_args=(
            --publish never
            --mac "--${{ matrix.electron_arch }}"
            # Installers only: the .zip electron-updater would want is not
            # published, so building it is wasted time and disk.
            -c.mac.target=dmg
            -c.mac.notarize=false
            # Our own entitlements rather than the ones upstream ships: they add
            # the library-validation exemption hardened runtime needs once the
            # certificate's Team ID is empty. See entitlements/.
            "-c.mac.entitlements=${GITHUB_WORKSPACE}/entitlements/entitlements.mac.plist"
            "-c.mac.entitlementsInherit=${GITHUB_WORKSPACE}/entitlements/entitlements.mac.inherit.plist"
            "-c.publish.owner=${PUBLISH_OWNER}"
            "-c.publish.repo=${PUBLISH_REPO}"
            -c.publish.releaseType=release
            "-c.publish.channel=${UPDATE_CHANNEL}"
          )
          echo "electron-builder args: ${build_args[*]}"
          npm run build:desktop -- "${build_args[@]}"

      - name: Verify build artifacts
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          arch="${{ matrix.electron_arch }}"

          # Anything missing here means electron-builder changed its output layout
          # and the upload step below would publish a release with holes in it.
          shopt -s nullglob
          dmgs=( "$release_dir"/*-"$arch".dmg )
          shopt -u nullglob

          if (( ${#dmgs[@]} == 0 )); then
            echo "::error::no .dmg for $arch in $release_dir"; ls -la "$release_dir"; exit 1
          fi

          echo "Artifacts for $arch:"
          ls -la "${dmgs[@]}"

      - name: Assert code signature
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          shopt -s nullglob
          apps=( "$release_dir"/mac*/*.app )
          shopt -u nullglob
          if (( ${#apps[@]} == 0 )); then
            echo "::error::no .app under $release_dir"; ls -la "$release_dir"; exit 1
          fi
          app="${apps[0]}"

          requirement="$(codesign -d -r- "$app" 2>/dev/null \
            | sed -n 's/^#\{0,1\}[[:space:]]*designated => //p')"
          echo "App: $app"
          echo "Designated requirement: ${requirement:-<none>}"

          if [ "${EXPECT_SIGNED:-false}" != "true" ]; then
            echo "::warning::Publishing an unsigned build — macOS auto-update will not work on it."
            exit 0
          fi

          if [ -z "$requirement" ]; then
            echo "::error::$app is not code signed, but a signing certificate was configured."
            echo "::error::electron-builder did not find the identity; check the trust step above."
            exit 1
          fi
          if printf '%s' "$requirement" | grep -q 'cdhash'; then
            echo "::error::$app fell back to an ad-hoc signature. Its designated requirement is pinned"
            echo "::error::to a cdhash that changes on every build, so Squirrel.Mac would reject every"
            echo "::error::future update. The certificate was not visible to electron-builder."
            exit 1
          fi
          echo "Signed with a stable designated requirement; this build can install its own updates."

      - name: Assert nested code carries the app's signature
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          shopt -s nullglob
          apps=( "$release_dir"/mac*/*.app )
          shopt -u nullglob
          app="${apps[0]}"

          # The root signature is not the whole story. Electron ships pre-signed
          # binaries, so a signing pass that covers the app but misses a nested
          # framework leaves two certificates inside one bundle — and nothing here
          # fails. It fails on someone's Mac, where dyld refuses to load a
          # framework whose Team ID differs from the process's and the app dies
          # before it can draw a window.
          #
          # The script compares signing certificates rather than Team IDs, because
          # a self-signed certificate produces no Team ID — comparing those found
          # everything equal and passed the very bundle that shipped and crashed.
          echo "Sealed resources:"
          codesign --verify --deep --strict "$app"
          echo "Nested binaries:"
          node "${GITHUB_WORKSPACE}/scripts/assert-mac-signatures.mjs" "$app"

      - name: Assert the entitlements reached the bundle
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          shopt -s nullglob
          apps=( "$release_dir"/mac*/*.app )
          shopt -u nullglob
          app="${apps[0]}"

          # entitlements/ is wired in with -c.mac.entitlements above, and a typo
          # in that path is silent: electron-builder signs without the file and
          # the bundle still verifies. This is what makes the wiring visible.
          # Written to a file rather than piped so `grep -q` exiting early cannot
          # trip `pipefail`.
          entitlements="$RUNNER_TEMP/entitlements.plist"
          codesign -d --entitlements - "$app" > "$entitlements" 2>/dev/null || true
          cat "$entitlements"

          for key in \
            com.apple.security.cs.disable-library-validation \
            com.apple.security.cs.allow-jit; do
            if ! grep -qa "$key" "$entitlements"; then
              echo "::error::$app does not carry $key — -c.mac.entitlements did not take effect."
              exit 1
            fi
          done
          echo "The bundle carries the entitlements from entitlements/."

      - name: Smoke-launch the packaged app
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          shopt -s nullglob
          apps=( "$release_dir"/mac*/*.app )
          shopt -u nullglob
          app="${apps[0]}"
          exe="$app/Contents/MacOS/Paseo"

          # The steps above read the bundle; this one runs it. dyld resolves the
          # Electron Framework at load time, so a bundle whose nested code cannot
          # be loaded dies right here with `different Team IDs` — the same failure
          # a user hits on install, caught while the run can still go red and
          # before anything is published.
          #
          # ELECTRON_RUN_AS_NODE=1 runs the binary as Node instead of opening a
          # window. A second Paseo GUI on a machine already running one is not
          # something a build should cause.
          if [ ! -x "$exe" ]; then
            echo "::error::no executable at $exe"; exit 1
          fi

          # Captured to a file for the same reason as above: no upstream pipe for
          # an early-exiting `grep -q` to break under `pipefail`.
          probe="$RUNNER_TEMP/paseo-smoke.log"
          set +e
          ELECTRON_RUN_AS_NODE=1 "$exe" -e 'console.log(1)' > "$probe" 2>&1
          status=$?
          set -e

          cat "$probe"
          if [ "$status" -ne 0 ]; then
            echo "::error::the packaged app exited $status without starting — dyld could not load its own frameworks."
            exit 1
          fi
          if ! grep -qx '1' "$probe"; then
            echo "::error::the packaged app started but the probe printed nothing."
            exit 1
          fi
          echo "The packaged app loads its own frameworks and runs."

      - name: Publish artifacts to GitHub Release
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          # The Android workflow normally created the release already. Create it
          # here too so a desktop-only run still produces something usable.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Paseo $tag (status bar fixed + Kimi support)" \
              --notes "Automated build of upstream ${UPSTREAM_REPO}@$tag.")
            if [ "${{ needs.resolve.outputs.is_prerelease }}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

          node "${GITHUB_WORKSPACE}/scripts/upload-release-assets.mjs" \
            "$tag" "$release_dir" "$GITHUB_REPOSITORY"

  verify:
    name: verify published assets
    needs: [resolve]
    if: ${{ github.event.inputs.verify_only == 'true' }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout build repo (the verification script lives here)
        uses: actions/checkout@v4

      - name: Download the published disk images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          mkdir -p downloaded
          # A .dmg is the only thing on the Release that carries an .app, so this
          # pattern is exact where a Paseo-*.zip pattern was not.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Paseo-*.dmg' --dir downloaded
          ls -la downloaded

      - name: Mount, verify and unmount each disk image
        run: |
          set -euo pipefail
          status=0
          for image in downloaded/*.dmg; do
            name="$(basename "$image" .dmg)"
            mount="$(mktemp -d)"

            echo "::group::$name"
            # Verify what a user actually mounts, not an intermediate build tree.
            if ! hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount" >/dev/null; then
              echo "::error::$image did not mount"
              status=1
              echo "::endgroup::"
              continue
            fi

            app="$(find "$mount" -maxdepth 2 -name '*.app' -type d -print -quit)"
            if [ -z "$app" ]; then
              echo "::error::$image contains no .app"
              status=1
            else
              codesign --verify --deep --strict "$app" || status=1
              node scripts/assert-mac-signatures.mjs "$app" || status=1

              # Read the bundle, then run it. dyld loads the Electron Framework
              # at start-up, so this is where a bundle nobody can launch fails —
              # on the artifact users actually downloaded, not a build tree.
              exe="$app/Contents/MacOS/Paseo"
              probe="$RUNNER_TEMP/paseo-smoke-${name}.log"
              set +e
              ELECTRON_RUN_AS_NODE=1 "$exe" -e 'console.log(1)' > "$probe" 2>&1
              probe_status=$?
              set -e
              cat "$probe"
              if [ "$probe_status" -ne 0 ] || ! grep -qx '1' "$probe"; then
                echo "::error::$app cannot launch (exit $probe_status) — dyld could not load its own frameworks."
                status=1
              fi
            fi

            hdiutil detach "$mount" >/dev/null || true
            rmdir "$mount" 2>/dev/null || true
            echo "::endgroup::"
          done
          exit "$status"

