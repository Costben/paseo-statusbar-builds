name: Build patched Paseo for Windows

# Builds an unsigned, patched Paseo NSIS installer for Windows x64 and publishes
# it to this repo's Releases, alongside the Android APK and the macOS .dmg for
# the same upstream tag. The installer is what the in-app updater runs and
# latest.yml is what points it there, so both are published: install once and
# every later version arrives through the app. An unsigned build can do this —
# electron-builder omits `publisherName` from app-update.yml when there is no
# certificate, and `NsisUpdater.verifySignature` checks nothing when it is absent.
# See README ("Update hijack").
#
# Chained off the macOS workflow so the three builds run one after another
# instead of racing on the same Release. The daily schedule is the safety net.
#
# x64 only: Windows on ARM is a small share, and adding it would roughly double
# this job's runtime. Add `--arm64` to the build step's arch list if that
# changes, and the extra architecture patterns to `resolve`.
#
# The Release is tagged with the version it contains; the `version` input
# overrides the upstream tag's version, exactly as in the macOS workflow.

on:
  workflow_run:
    workflows: ["Build patched Paseo for macOS"]
    types: [completed]
  schedule:
    - cron: "23 6 * * *" # daily, off-peak minute
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (blank = latest non-draft release)"
        required: false
        type: string
      version:
        description: "Publish this version instead of the tag's (blank = the tag's). Must be valid semver."
        required: false
        type: string
      force:
        description: "Rebuild even if this release already has every Windows artifact"
        required: false
        type: boolean
        default: false

# Shared with the macOS workflow so the two desktop builds never write to the
# same Release at the same time.
concurrency:
  group: paseo-desktop-builds-v1
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: getpaseo/paseo
  DESKTOP_PACKAGE_PATH: packages/desktop

  # Where the built app looks for its own updates. electron-builder writes this
  # into resources/app-update.yml at pack time, so redirecting the updater is a
  # build-config change, not a code patch.
  PUBLISH_OWNER: Costben
  PUBLISH_REPO: paseo-statusbar-builds

  # electron-updater resolves <channel>.yml on Windows, where <channel> is the
  # app's release-channel setting ("latest" for stable, "beta" for beta). We
  # generate `latest` and publish a byte-identical copy per EXTRA_CHANNELS entry,
  # so either setting resolves to the same build. Set explicitly so the feed name
  # stays pinned at Costben's repo instead of upstream's.
  UPDATE_CHANNEL: latest
  EXTRA_CHANNELS: beta

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release_tag: ${{ steps.pick.outputs.release_tag }}
      version: ${{ steps.pick.outputs.version }}
      is_prerelease: ${{ steps.pick.outputs.is_prerelease }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
            is_prerelease="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" --jq '.prerelease' 2>/dev/null || echo false)"
            echo "Using requested tag: $tag"
          else
            release="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq 'map(select(.draft == false))
                    | sort_by(.published_at) | reverse | .[0]')"
            tag="$(jq -r '.tag_name // empty' <<< "$release")"
            is_prerelease="$(jq -r '.prerelease // false' <<< "$release")"
            echo "Latest upstream release: $tag (prerelease=$is_prerelease)"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve an upstream tag." >&2
            exit 1
          fi
          # v0.9.1 / desktop-v0.9.1 / desktop-windows-v0.9.1 -> 0.9.1
          version="$(printf '%s' "$tag" | sed -E 's/^(desktop(-(windows|linux|macos))?|android)-v/v/; s/^v//')"

          # As on macOS: the Release is tagged with the version it holds, so an
          # override moves the Release with it.
          override="${{ github.event.inputs.version }}"
          release_tag="$tag"
          if [ -n "$override" ]; then
            version="$override"
            release_tag="v$version"
            # GET /releases/latest ignores prereleases, and that endpoint is how
            # the updater finds the feed.
            is_prerelease="false"
            echo "Publishing version $version as Release $release_tag (built from upstream $tag)"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream $tag as version $version"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.pick.outputs.release_tag }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force requested; will rebuild."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=()
          # Everything the app needs to install its own update: the NSIS .exe the
          # updater runs, the .zip it falls back to, and the manifest naming them.
          # A Release missing the manifest is one whose updater 404s.
          for pattern in \
            '^Paseo-Setup-.*-x64\.exe$' \
            '^Paseo-Setup-.*-x64\.zip$' \
            '^latest\.yml$' \
            '^beta\.yml$'; do
            grep -Eq "$pattern" <<< "$assets" || missing+=("$pattern")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "Release $release_tag already has every Windows artifact; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $release_tag is missing: ${missing[*]}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build and publish (Windows x64)
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build repo (patch scripts live here)
        uses: actions/checkout@v4

      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Report runner disk space
        run: |
          set -euo pipefail
          df -h /c

          # Nothing in this job needs a JDK, Python, Ruby or Go. On the Windows
          # image they are the cheap wins; unlike the Linux runner there is no
          # apt cache or large SDK to reclaim.
          rm -rf \
            /c/hostedtoolcache/windows/Java_* \
            /c/hostedtoolcache/windows/PyPy \
            /c/hostedtoolcache/windows/Python \
            /c/hostedtoolcache/windows/Ruby \
            /c/hostedtoolcache/windows/go || true

          echo "After cleanup:"
          df -h /c

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: upstream/package-lock.json

      - name: Apply desktop patches
        run: node scripts/apply-desktop-patch.mjs upstream win

      - name: Install JS dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt ${attempt}/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Set desktop package version from tag
        working-directory: upstream
        env:
          DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error("DESKTOP_VERSION env var is missing");

          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, "package.json");
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          console.log(`Set ${packageJsonPath} version to ${version}`);
          NODE

      - name: Build desktop release
        working-directory: upstream
        env:
          # No Windows code-signing certificate on this runner. electron-builder
          # then omits `publisherName` from app-update.yml, which is exactly what
          # makes the auto-updater skip Authenticode verification at install
          # time — see the README.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          build_args=(
            --publish never
            --win --x64
            # No -c.win.target override: upstream's default builds the NSIS
            # installer and the .zip, and the updater runs the installer.
            "-c.publish.owner=${PUBLISH_OWNER}"
            "-c.publish.repo=${PUBLISH_REPO}"
            -c.publish.releaseType=release
            "-c.publish.channel=${UPDATE_CHANNEL}"
          )
          echo "electron-builder args: ${build_args[*]}"
          npm run build:desktop -- "${build_args[@]}"

      - name: Verify build artifacts
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          version="${{ needs.resolve.outputs.version }}"

          shopt -s nullglob
          installers=( "$release_dir"/*-x64.exe )
          zips=( "$release_dir"/*-x64.zip )
          manifest="$release_dir/${UPDATE_CHANNEL}.yml"
          shopt -u nullglob

          if (( ${#installers[@]} == 0 )); then
            echo "::error::no NSIS installer in $release_dir"; ls -la "$release_dir"; exit 1
          fi
          if (( ${#zips[@]} == 0 )); then
            echo "::error::no .zip in $release_dir"; ls -la "$release_dir"; exit 1
          fi
          if [ ! -f "$manifest" ]; then
            echo "::error::updater manifest is missing: $manifest"; ls -la "$release_dir"; exit 1
          fi

          grep -q '^files:' "$manifest" || { echo "::error::$manifest has no files list"; cat "$manifest"; exit 1; }
          # NsisUpdater runs the NSIS .exe, so a manifest that lists only the .zip
          # leaves Windows with nothing to install.
          grep -q '\.exe' "$manifest" || { echo "::error::$manifest does not reference the .exe"; cat "$manifest"; exit 1; }
          # The manifest's version is what the updater compares against, and a
          # `version` override reaches it only through package.json — this is what
          # makes that wiring visible.
          grep -q "^version: ${version}$" "$manifest" || {
            echo "::error::$manifest does not declare version ${version}; the package.json version did not take"
            cat "$manifest"; exit 1
          }

          echo "Artifacts:"
          ls -la "${installers[@]}" "${zips[@]}" "$manifest"
          echo "--- $manifest ---"
          cat "$manifest"

      - name: Stage updater manifests
        working-directory: upstream
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          # The manifest carries no channel name inside it, so the extra channels
          # are byte-identical copies and either release-channel setting resolves
          # to the same build. upload-release-assets.mjs uploads them last, after
          # the archives they name.
          for channel in ${EXTRA_CHANNELS}; do
            cp "${release_dir}/${UPDATE_CHANNEL}.yml" "${release_dir}/${channel}.yml"
          done
          ls -la "$release_dir"/*.yml

      - name: Publish artifacts to GitHub Release
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ needs.resolve.outputs.release_tag }}"
          upstream_tag="${{ needs.resolve.outputs.tag }}"
          release_dir="${DESKTOP_PACKAGE_PATH}/release"

          # The Android workflow normally created the release already. Create it
          # here too so a desktop-only run still produces something usable, and so
          # a `version` override — whose release_tag is that version, not the
          # upstream tag — has a Release of its own to land in.
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Paseo $release_tag (status bar fixed + Kimi support)" \
              --notes "Automated build of upstream ${UPSTREAM_REPO}@$upstream_tag.")
            if [ "${{ needs.resolve.outputs.is_prerelease }}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

          node "${GITHUB_WORKSPACE}/scripts/upload-release-assets.mjs" \
            "$release_tag" "$release_dir" "$GITHUB_REPOSITORY"

