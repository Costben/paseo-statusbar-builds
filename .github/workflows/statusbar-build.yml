name: Build status-bar-fixed Paseo APK

# Polls upstream getpaseo/paseo for new releases, applies the edge-to-edge
# status bar patch, builds an Android release APK on a clean Linux runner, and
# publishes it to this repo's Releases. GitHub cannot push us upstream events,
# so "auto" = scheduled polling. Manual runs via the "Run workflow" button.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h on an off-peak minute
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (blank = latest non-draft release)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release for this tag already exists"
        required: false
        type: boolean
        default: false

concurrency:
  group: statusbar-build-arm64-v1
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: getpaseo/paseo
  PASEO_ANDROID_ARCHS: arm64-v8a
  PASEO_NDK_PRIMARY_VERSION: r27b
  PASEO_NDK_PRIMARY_FULL_VERSION: 27.1.12297006
  PASEO_NDK_FALLBACK_FULL_VERSION: 27.3.13750724
  PASEO_NDK_LEGACY_FULL_VERSION: 27.0.12077973

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      is_prerelease: ${{ steps.pick.outputs.is_prerelease }}
      apk_asset: ${{ steps.pick.outputs.apk_asset }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
            is_prerelease="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" --jq '.prerelease' 2>/dev/null || echo false)"
            echo "Using requested tag: $tag"
          else
            release="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq 'map(select(.draft == false))
                    | sort_by(.published_at) | reverse | .[0]')"
            tag="$(jq -r '.tag_name // empty' <<< "$release")"
            is_prerelease="$(jq -r '.prerelease // false' <<< "$release")"
            echo "Latest upstream release: $tag (prerelease=$is_prerelease)"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve an upstream tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "apk_asset=paseo-${tag}-statusbar-fixed.apk" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.pick.outputs.tag }}"
          asset_name="${{ steps.pick.outputs.apk_asset }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force requested; will rebuild."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset_name"; then
            echo "Release $tag already has $asset_name; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No APK asset $asset_name for $tag yet; will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keepalive (avoid 60-day schedule auto-disable)
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit age: ${age_days}d"
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive scheduled workflow"
            git push
          fi

  build:
    name: build and publish (arm64-v8a)
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout build repo (patch script lives here)
        uses: actions/checkout@v4

      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /usr/local/share/CodeQL \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Ruby

          docker system prune -af || true
          sudo apt-get clean

          echo "Disk after cleanup:"
          df -h

          available_kb="$(df --output=avail / | tail -n1 | tr -d ' ')"
          minimum_kb="$((8 * 1024 * 1024))"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "::error::Runner has less than 8 GiB free after cleanup."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: upstream/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled

      - name: Setup primary Android NDK
        id: setup-primary-ndk
        continue-on-error: true
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.PASEO_NDK_PRIMARY_VERSION }}
          add-to-path: false
          link-to-sdk: true
          local-cache: false

      - name: Validate Android NDK toolchain
        run: |
          set -euo pipefail

          host_tag="linux-x86_64"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          compiler_path() {
            printf '%s/toolchains/llvm/prebuilt/%s/bin/clang++' "$1" "$host_tag"
          }

          ndk_is_usable() {
            local ndk_path="$1"
            [ -x "$(compiler_path "$ndk_path")" ] && [ -f "$ndk_path/build/cmake/android.toolchain.cmake" ]
          }

          use_ndk() {
            local version="$1"
            local ndk_path="${ANDROID_HOME}/ndk/${version}"
            echo "Using Android NDK ${version}: ${ndk_path}"
            "$(compiler_path "$ndk_path")" --version | head -n1
            echo "ANDROID_NDK_HOME=${ndk_path}" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=${ndk_path}" >> "$GITHUB_ENV"
            echo "PASEO_ANDROID_NDK_VERSION=${version}" >> "$GITHUB_ENV"
            echo "${ndk_path}/toolchains/llvm/prebuilt/${host_tag}/bin" >> "$GITHUB_PATH"
          }

          try_install_ndk() {
            local version="$1"
            local ndk_path="${ANDROID_HOME}/ndk/${version}"
            if ndk_is_usable "$ndk_path"; then
              use_ndk "$version"
              return 0
            fi

            echo "::warning::Android NDK ${version} is missing or incomplete; reinstalling with sdkmanager."
            rm -rf "$ndk_path"
            set +o pipefail
            yes | "$sdkmanager" --install "ndk;${version}" >/dev/null
            install_status="$?"
            set -o pipefail
            if [ "$install_status" -ne 0 ]; then
              echo "::warning::sdkmanager exited with status ${install_status} while installing Android NDK ${version}."
            fi

            if ndk_is_usable "$ndk_path"; then
              use_ndk "$version"
              return 0
            fi

            echo "::warning::Android NDK ${version} still has no usable LLVM compiler after reinstall."
            return 1
          }

          echo "Primary NDK setup outcome: ${{ steps.setup-primary-ndk.outcome }}"
          echo "Primary NDK reported version: ${{ steps.setup-primary-ndk.outputs.ndk-full-version }}"
          ls -la "${ANDROID_HOME}/ndk"

          for version in \
            "$PASEO_NDK_PRIMARY_FULL_VERSION" \
            "$PASEO_NDK_FALLBACK_FULL_VERSION" \
            "$PASEO_NDK_LEGACY_FULL_VERSION"; do
            if try_install_ndk "$version"; then
              exit 0
            fi
          done

          echo "::warning::Pinned NDK versions were unusable; scanning installed SDK NDKs."
          for ndk_path in "${ANDROID_HOME}"/ndk/*; do
            [ -d "$ndk_path" ] || continue
            version="$(basename "$ndk_path")"
            if ndk_is_usable "$ndk_path"; then
              use_ndk "$version"
              exit 0
            fi
          done

          echo "::error::No usable Android NDK toolchain found."
          find "${ANDROID_HOME}/ndk" -maxdepth 4 -type f -name 'clang++' -print || true
          exit 1

      - name: Apply status bar patch
        run: node scripts/apply-statusbar-patch.mjs upstream

      - name: Install JS dependencies
        working-directory: upstream
        run: npm ci

      - name: Build workspace deps
        working-directory: upstream
        run: |
          set -euo pipefail
          if node -e "const p=require('./packages/app/package.json'); process.exit(p.scripts && p.scripts['build:workspace-deps'] ? 0 : 1)"; then
            npm run build:workspace-deps --workspace=@getpaseo/app
          elif node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:app-deps'] ? 0 : 1)"; then
            npm run build:app-deps
          else
            echo "Cannot find workspace deps build script (tried build:workspace-deps in packages/app and build:app-deps in repo root)." >&2
            exit 1
          fi

      - name: Expo prebuild (Android)
        working-directory: upstream/packages/app
        env:
          APP_VARIANT: production
          NODE_ENV: production
          EXPO_NO_GIT_STATUS: "1"
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Create monorepo bundle entry shim
        working-directory: upstream
        run: |
          mkdir -p packages/app/packages/app
          printf 'import "../../index";\n' > packages/app/packages/app/index.ts

      - name: Tune Gradle build memory
        working-directory: upstream/packages/app/android
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "gradle.properties";
          const desired = {
            "org.gradle.jvmargs": "-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8",
            "org.gradle.workers.max": "2",
            "org.gradle.daemon": "false",
            "org.gradle.parallel": "false",
            "kotlin.compiler.execution.strategy": "in-process",
            "android.ndkVersion": process.env.PASEO_ANDROID_NDK_VERSION,
            "reactNativeArchitectures": process.env.PASEO_ANDROID_ARCHS,
          };
          const keys = new Set(Object.keys(desired));
          const original = fs.readFileSync(path, "utf8");
          const lines = original
            .split(/\r?\n/)
            .filter((line) => {
              const key = line.split("=", 1)[0].trim();
              return line.trim() !== "" && !keys.has(key);
            });
          for (const [key, value] of Object.entries(desired)) {
            lines.push(`${key}=${value}`);
          }
          fs.writeFileSync(path, `${lines.join("\n")}\n`, "utf8");
          NODE

      - name: Build release APK
        working-directory: upstream/packages/app/android
        env:
          APP_VARIANT: production
          NODE_ENV: production
          EXPO_NO_GIT_STATUS: "1"
          ENTRY_FILE: packages/app/index.ts
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          set -euo pipefail
          # Expo CLI reads CI as a strict boolean; remove it instead of
          # exporting an empty string, which crashes JS bundling.
          unset CI
          chmod +x ./gradlew
          (
            while true; do
              sleep 60
              echo "[gradle-heartbeat] still building at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid="$!"
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          ./gradlew :app:assembleRelease \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            -PreactNativeArchitectures="$PASEO_ANDROID_ARCHS" \
            --no-daemon --build-cache --max-workers=2 --console=plain --stacktrace

      - name: Prepare and verify arm64 APK
        id: apk
        working-directory: upstream
        run: |
          set -euo pipefail
          source_apk="$(find packages/app/android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$source_apk" ]; then
            echo "No APK produced; dumping outputs tree:" >&2
            find packages/app/android/app/build/outputs -type f || true
            exit 1
          fi
          keystore="$(find packages/app/android/app -maxdepth 1 -type f -name '*.keystore' | head -n1)"
          if [ -z "$keystore" ]; then
            echo "No APK signing keystore produced by Expo prebuild." >&2
            exit 1
          fi
          keytool -list \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          build_tools_version="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          build_tools="$ANDROID_HOME/build-tools/$build_tools_version"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$zipalign" ] || [ ! -x "$apksigner" ]; then
            echo "Android build tools are unavailable: $build_tools" >&2
            exit 1
          fi

          unsigned="$RUNNER_TEMP/paseo-arm64-unsigned.apk"
          aligned="$RUNNER_TEMP/paseo-arm64-aligned.apk"
          destination="$RUNNER_TEMP/${{ needs.resolve.outputs.apk_asset }}"
          cp "$source_apk" "$unsigned"
          zip -q -d "$unsigned" 'META-INF/*' || true
          "$zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$destination" \
            "$aligned"
          "$zipalign" -c -P 16 4 "$destination"
          "$apksigner" verify --verbose --print-certs "$destination"

          mapfile -t packaged_architectures < <(
            unzip -Z1 "$destination" \
              | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' \
              | sort -u
          )
          if [ "${#packaged_architectures[@]}" -ne 1 ] \
            || [ "${packaged_architectures[0]:-}" != "$PASEO_ANDROID_ARCHS" ]; then
            printf 'Unexpected packaged architectures: %s\n' "${packaged_architectures[*]:-(none)}" >&2
            exit 1
          fi
          if ! unzip -Z1 "$destination" | grep -Eq "^lib/${PASEO_ANDROID_ARCHS}/.+\\.so$"; then
            echo "APK contains no native libraries for $PASEO_ANDROID_ARCHS." >&2
            exit 1
          fi

          certificate="$("$apksigner" verify --print-certs "$destination" \
            | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/p' \
            | head -n1)"
          if [ -z "$certificate" ]; then
            echo "Could not read the final APK signing certificate." >&2
            exit 1
          fi

          echo "path=$destination" >> "$GITHUB_OUTPUT"
          echo "Built APK: $destination ($(du -h "$destination" | cut -f1))"
          echo "Packaged architecture: ${packaged_architectures[0]}"
          echo "Signing certificate SHA-256: $certificate"
          sha256sum "$destination"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Paseo $tag (status bar fixed)" \
              --notes "Automated status-bar-fixed build of upstream ${UPSTREAM_REPO}@$tag.")
            if [ "${{ needs.resolve.outputs.is_prerelease }}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber --repo "$GITHUB_REPOSITORY"
